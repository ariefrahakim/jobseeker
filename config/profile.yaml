    - Manual Tester
    - QA Intern
    - Junior QA
    - Game Tester
    - Hardware Test Technician
    - QC Inspector
    - Data Entry

# Skills are weighted. Weight is how much a hit moves the score, not how good
# you are at it. `core` = your differentiators, `secondary` = supporting,
