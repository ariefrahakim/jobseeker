# Titles worth applying to. `primary` drives search queries; `accept` is the
# wider net used when scoring a title we did not search for explicitly.
titles:
  primary:
    - QA Automation Lead
    - Lead QA Engineer
    - SDET
    - Software Development Engineer in Test
    - Senior QA Automation Engineer
    - QA Engineering Manager
  accept:
    - Test Automation Engineer
    - Senior Test Engineer
    - Quality Engineer
    - Principal QA Engineer
    - Staff QA Engineer
    - Automation Architect
    - Platform QA Engineer
  # Anything matching these is dropped regardless of other signals.
