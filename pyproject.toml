[project]
name = "jobseeker"
version = "1.0.0"
description = "Profile-driven job search agent for QA / SDET roles"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Arief Rahman Hakim" }]
dependencies = [
    "requests>=2.31.0",
    "PyYAML>=6.0.1",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.116.0"]
browser = ["playwright>=1.40.0"]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]

[project.scripts]
jobseeker = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
